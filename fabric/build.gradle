plugins {
    id 'fabric-loom' version '1.11.8'
    id 'java'
}

group = 'com.logan'
version = '1.21.1-1.0.0'
base {
    archivesName = 'originswildfirecompat-fabric'
}

loom {
    mods {
        originswildfirecompat {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'

    // Origins Fabric 1.13.0-pre.3+mc.1.21.1 (pre-release, unica opcao 1.21.1)
    modImplementation 'maven.modrinth:3BeIrqZR:fcGzZVGn'

    // Pehkui Fabric 3.8.3 (cobre 1.21.1)
    modImplementation 'maven.modrinth:t5W7Jfwy:6fzxx6SC'

    // Wildfire's Female Gender Mod Fabric 3.2.1+1.21 (cobre 1.21/1.21.1)
    modImplementation 'maven.modrinth:bcOsQHnC:kJmjQvAS'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}
