pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()

        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }

        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.5.0'
}

rootProject.name = 'OriginsWildfireCompat'

def includeFabric = providers.gradleProperty("includeFabric").getOrElse(System.getenv("INCLUDE_FABRIC") ?: "false") == "true"
if (includeFabric) {
    include 'fabric'
}