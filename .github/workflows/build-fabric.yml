name: Build Fabric

on:
  push:
    branches: [main]
    tags:
      - 'fabric-1.21.1-*'
    paths:
      - 'fabric/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-fabric.yml'
  pull_request:
    paths:
      - 'fabric/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - name: Make gradlew executable
        run: chmod +x ../gradlew
      - name: Build Fabric module
        run: ../gradlew build --console=plain --stacktrace
      - name: List built jars
        run: ls -l build/libs/
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: originswildfirecompat-fabric
          path: fabric/build/libs/*.jar
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/originswildfirecompat-fabric-*.jar --generate-notes
