name: Build Fabric

on:
  push:
    branches: [main]
    paths:
      - 'fabric/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-fabric.yml'
  pull_request:
    paths:
      - 'fabric/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Make gradlew executable
        run: chmod +x ../gradlew
      - name: Build Fabric module
        run: ../gradlew build --console=plain --stacktrace
      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: originswildfirecompat-fabric
          path: build/libs/*.jar
