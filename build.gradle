plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.logan'
version = '1.20.1-1.0.0'

base {
    archivesName = 'originswildfirecompat-forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                originswildfirecompat {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces',
                    'originswildfirecompat'
        }

        server {
            property 'forge.enabledGameTestNamespaces',
                    'originswildfirecompat'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces',
                    'originswildfirecompat'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod',
                    'originswildfirecompat',
                    '--all',
                    '--output',
                    file('src/generated/resources/'),
                    '--existing',
                    file('src/main/resources/')
        }
    }
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }

        forRepositories(fg.repository)

        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'

    // Origins Forge (native port by EdwinMindcraft) 1.20.1-1.10.0.9
    // implementation: goes to runtime. In dev runClient its mixin breaks,
    // but works on real launchers (production). Test via launcher + run/mods.
    implementation fg.deobf(
            "maven.modrinth:jl3m2lR9:vynFXywM"
    )

    // Caelus API Forge (dependency of Origins Forge) 3.2.0+1.20.1
    implementation fg.deobf(
            "maven.modrinth:40FYwb4z:mRry0DgY"
    )

    // Pehkui Forge 3.8.2+1.20.1-forge
    implementation fg.deobf(
            "maven.modrinth:t5W7Jfwy:SQpqSgAE"
    )

    // Wildfire's Female Gender Mod Forge 1.20.1-3.0.1 (Forge port of 3.1)
    implementation fg.deobf(
            "maven.modrinth:bcOsQHnC:R1d8TWqL"
    )
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1',
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version: '47.3.0',
            forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'originswildfirecompat',
            mod_name: "Origins: Wildfire's Gender Compat",
            mod_license: 'MIT',
            mod_version: project.version
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'Origins Wildfire Compat',
                'Specification-Vendor': 'Logan',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'Logan'
        ])
    }
}

jar.finalizedBy('reobfJar')